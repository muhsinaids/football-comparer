<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Football Player Comparer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Football Player Comparer</h1>

  <div class="search-container">
    <div class="player-box" id="player1-box">
      <h2>Player 1</h2>
      <input type="text" id="search1" placeholder="Search player...">
      <button onclick="searchPlayer(1)">Search</button>
      <div id="results1" class="results"></div>
      <div id="saved1" class="saved-player"></div>
    </div>

    <div class="player-box" id="player2-box">
      <h2>Player 2</h2>
      <input type="text" id="search2" placeholder="Search player...">
      <button onclick="searchPlayer(2)">Search</button>
      <div id="results2" class="results"></div>
      <div id="saved2" class="saved-player"></div>
    </div>
  </div>

  <button id="compare-btn" onclick="compareStats()">Compare</button>

  <div id="comparison-output"></div>

  <script src="app.js"></script>
</body>
</html>
